[tools]
buf = "1.73.0"
bun = "1.4.3"
go = "1.27.2"
"go:github.com/pressly/goose/v3/cmd/goose" = "3.29.0"
"go:google.golang.org/grpc/cmd/protoc-gen-go-grpc" = "1.6.2"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.12"
golangci-lint = "2.14.0"
python = "3.15.0"
uv = "0.13.0"

[env]
UV_PYTHON_DOWNLOADS = "never"

[tasks."bff:dev"]
dir = "services/bff"
run = "bun run --watch src/index.ts"

[tasks."bff:test"]
dir = "services/bff"
run = "bun test"

[tasks."catalog:migrate"]
description = "Run goose against the catalog database, e.g. `mise run catalog:migrate up`"
dir = "services/catalog"
env = { GOOSE_DRIVER = "postgres", GOOSE_DBSTRING = "{{env.CATALOG_DATABASE_URL}}", GOOSE_MIGRATION_DIR = "db/migrations" }
run = "goose"

[tasks."partner:webhook"]
description = "Open webhook to receive events from the mock partner service"
dir = "services/mock-partner"
run = "uv run uvicorn mock_partner.webhook:app --reload --port 8091"

[tasks."partner:test"]
description = "Run all scenario tests for the mock partner service"
dir = "services/mock-partner"
run = "uv run pytest scenarios -v"

[tasks."mock:payment"]
description = "Open mock payment provider service to handle payment requests"
dir = "services/mock-payment-provider"
run = "uv run uvicorn mock_payment.main:app --reload --port 8092"
