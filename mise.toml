[tools]
buf = "1.73.0"
bun = "1.4.3"
go = "1.27.2"
"go:google.golang.org/grpc/cmd/protoc-gen-go-grpc" = "1.6.2"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.12"
golangci-lint = "2.14.0"
python = "3.15.0"
uv = "0.13.0"

[tasks."bff:dev"]
dir = "services/bff"
run = "bun run --watch src/index.ts"

[tasks."bff:test"]
dir = "services/bff"
run = "bun test"
