services:
  localdb:
    container_name: localdb
    image: postgres:18.6
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: localdb
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD}
      CATALOG_SERVICE_PASSWORD: ${CATALOG_SERVICE_PASSWORD}
      BOOKING_SERVICE_PASSWORD: ${BOOKING_SERVICE_PASSWORD}
      PAYMENT_SERVICE_PASSWORD: ${PAYMENT_SERVICE_PASSWORD}
      PARTNER_SERVICE_PASSWORD: ${PARTNER_SERVICE_PASSWORD}
      NOTIFICATION_SERVICE_PASSWORD: ${NOTIFICATION_SERVICE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - localdb_data:/var/lib/postgresql
      - ./scripts/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  localdb_data:
