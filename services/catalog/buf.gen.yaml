version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/coregatekit/ticketlite/services/catalog/internal/gen
plugins:
  - local: protoc-gen-go
    out: services/catalog/internal/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: services/catalog/internal/gen
    opt: paths=source_relative
